server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve index.html for any client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> netzsim (strip the /api prefix)
    location /api/ {
        proxy_pass http://netzsim:8000/;
        proxy_set_header Host $host;
        # The day-graph endpoints solve a whole day of power flows (plus WLS
        # runs for the Schätzung layer) on the first request per day — tens of
        # seconds on a district. nginx's default 60 s read timeout would turn
        # that into a 504 and the graph would simply never appear.
        proxy_read_timeout 600s;
    }

    # WebSocket live stream
    location /ws {
        proxy_pass http://netzsim:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
